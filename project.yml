name: Yomidori

options:
  bundleIdPrefix: fi.misaki
  # iOS 26 is the floor (decided 2026-09-22): the tab bar's search pill, Liquid
  # Glass, and no version fallbacks. Platform-only APIs still go behind the
  # wrappers in YomidoriKit/App/Compat.swift so the Kit compiles for the tests.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  YomidoriCore:
    path: Packages/YomidoriCore

targets:
  Yomidori-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
      # The notices every bundled license asks for, shown on the About screen; the
      # repo's own file, so there is one copy to keep current.
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    entitlements:
      path: Sources/iOS/Yomidori.entitlements
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Yomidori
        # Track the version build settings so MARKETING_VERSION is the single
        # source of truth.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No encryption → declare it so every TestFlight/App Store upload skips
        # the export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        # The one permission the app asks for. Localized in Sources/Shared/InfoPlist.xcstrings.
        NSCameraUsageDescription: Yomidori takes a still of the page you are reading. The image stays on this device.
        # System-default launch screen (plain background).
        UILaunchScreen: {}
        # A shared collection is a .yomidori file (JSON) the app owns and opens, from AirDrop,
        # Messages or Files; the file is copied in, never edited in place.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: fi.misaki.yomidori.collection
            UTTypeDescription: Yomidori collection
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [yomidori]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Yomidori collection
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [fi.misaki.yomidori.collection]
        LSSupportsOpeningDocumentsInPlace: false
        # All four orientations: a universal (iPhone + iPad) app must support
        # them for iPad multitasking, or App Store validation rejects the build.
        # A book is read in either orientation anyway.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Matches the App Store Connect record. Don't change it — an ASC bundle
        # id can't be edited or reused once the record exists.
        PRODUCT_BUNDLE_IDENTIFIER: fi.misaki.yomidori
        # User-visible app/bundle name; without this it'd be the target name
        # "Yomidori-iOS".
        PRODUCT_NAME: Yomidori
        MARKETING_VERSION: "0.1.0"
        # The release lane bumps this at each cut (RELEASING.md); 0 means never released.
        CURRENT_PROJECT_VERSION: "8"
        GENERATE_INFOPLIST_FILE: NO
        # The Core ML models are loaded by URL; no generated classes, and no warning
        # about which language to generate them in.
        COREML_CODEGEN_LANGUAGE: None
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Team committed on purpose (it's not a secret): the release lane
        # archives headlessly with automatic signing, and the generated
        # project must carry the team for that to work.
        DEVELOPMENT_TEAM: U84DT7P75P
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: YomidoriCore
        product: YomidoriKit
    # Stamp the git commit into the bundled Info.plist (GitCommitSHA) so every
    # build self-identifies its source. Runs last, after the plist is copied
    # into the product; fires on archive too. See Scripts/embed-commit-sha.sh.
    postBuildScripts:
      - script: "\"$SRCROOT/Scripts/embed-commit-sha.sh\""
        name: Embed git commit SHA
        basedOnDependencyAnalysis: false
    # Explicit scheme so XcodeGen writes a SHARED scheme file — without it,
    # `xcodebuild -scheme Yomidori-iOS` fails on a fresh checkout.
    scheme:
      configVariants: []
